<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Genera API keys y secretos seguros gratis, con longitud y caracteres personalizables. 100% en tu navegador: la clave nunca se envía a ningún servidor."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:site_name" content="Keygen" />
    <meta property="og:title" content="Keygen · Generador de API keys seguras" />
    <meta
      property="og:description"
      content="API keys criptográficamente seguras, generadas 100% en tu navegador."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      ;(() => {
        try {
          const savedTheme = localStorage.getItem('api-key-theme')
          const preferredTheme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
          const theme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : preferredTheme
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <title>Keygen · Generador de API keys seguras</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
