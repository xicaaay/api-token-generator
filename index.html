    <meta
      name="description"
      content="Genera API keys y secretos seguros gratis, con longitud y caracteres personalizables. 100% en tu navegador: la clave nunca se envía a ningún servidor."
    />
    <link rel="canonical" href="https://api-token-generator.netlify.app/" />

      property="og:description"
      content="API keys criptográficamente seguras, generadas 100% en tu navegador."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      ;(() => {
        try {
          const savedTheme = localStorage.getItem('api-key-theme')
          const preferredTheme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
          const theme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : preferredTheme
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <title>Keygen · Generador de API keys seguras</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Keygen",
        "url": "https://api-token-generator.netlify.app/",
        "description": "Generador de API keys, secretos JWT, claves hex y UUID criptográficamente seguros. Funciona 100 % en el navegador.",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Cualquiera (navegador web)",
        "inLanguage": "es",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
